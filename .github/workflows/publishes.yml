  # job 2
  publish-image:
    name: "Publish Image"
    runs-on: ubuntu-latest
    steps:
      # step 2.1
      - name: "Checkout"
        uses: actions/checkout@v2.4.0

      # step 2.2
      - name: "Setup Java JDK"
        uses: actions/setup-java@v2.5.0
        with:
          distribution: 'zulu'
          java-version: 17

      # step 2.3
      - name: "Setup ENV"
        run: |
          echo "IMAGE_NAME=openjdk:17.0.2" >> $GITHUB_ENV;

      # step 2.4
      - name: "Package and Publish-Image-To-DockerHub"
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: |
          if [ "${{github.ref}}" == "refs/heads/snapshot" ] || [ "${{github.ref}}" == "refs/heads/develop" ]; then
            ./mvnw -T 4C clean package -Pimage               -DskipTests -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn;
          else
            ./mvnw -T 4C clean package -Pimage,release-image -DskipTests -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn;
          fi
